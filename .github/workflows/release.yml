# Publica o MAPA.exe numa GitHub Release, sozinho, quando voce empurra uma tag.
#
# Por que existe
# -------------
# O .exe tem 55 MB. Commitado no repositorio, o git guarda TODOS os builds para
# sempre e o historico nao encolhe depois. Release e o lugar certo: ate 2 GB por
# arquivo, fora do historico, com link estavel para circular.
#
# Como disparar
# -------------
#     git tag v0.8.1
#     git push origin v0.8.1
#
# O resto e automatico. Acompanhe em Actions; o .exe aparece em Releases.
#
# O que o runner faz, na ordem: compila com bp.spec, audita o binario (nada de
# cliente dentro, recursos obrigatorios e tkdnd presentes) e RODA o autoteste
# dentro do proprio .exe. Se qualquer passo falhar, nao ha release — foi assim
# que um binario com pandas quebrado chegou aos usuarios. Ver REVISAO_QUALIDADE
# §24 e PLANO_K_EMPACOTAMENTO.md.

name: Release do MAPA.exe

on:
  push:
    tags: ["v*"]
  # Permite disparar a mao pela aba Actions, sem criar tag — util para testar
  # o proprio workflow.
  workflow_dispatch:

permissions:
  contents: write        # necessario para criar a Release e anexar o arquivo

jobs:
  build:
    # Windows obrigatorio: o PyInstaller nao faz cross-compile. Um .exe Windows
    # so sai de uma maquina Windows.
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Instalar dependencias (com o extra de empacotamento)
        run: uv sync --extra packaging

      - name: Suite de testes
        run: uv run pytest -q -m "not integration"
        timeout-minutes: 10

      - name: Compilar, auditar e autotestar o .exe
        run: uv run python build.py
        timeout-minutes: 30

      - name: Guardar os relatorios do build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-do-build
          path: |
            dist/MAPA_autoteste.txt
            dist/MAPA_diagnostico.txt
          if-no-files-found: ignore

      - name: Publicar a Release com o .exe
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MAPA.exe
          generate_release_notes: true
          body: |
            ## MAPA — ${{ github.ref_name }}

            Baixe **MAPA.exe** abaixo. Arquivo unico, ~55 MB.
            Nao precisa instalar nada, nao precisa de administrador.

            **Abra com duplo clique normal.** O Windows bloqueia arrastar-e-soltar
            em janela aberta como administrador.

            Se algo der errado, rode `MAPA.exe --diagnostico` e mande o
            `MAPA_diagnostico.txt` que aparece ao lado do programa.

            ---
            Este binario passou, no runner: suite de testes, auditoria de
            conteudo (nenhum dado de cliente dentro) e autoteste do pipeline
            completo dentro do proprio .exe.
